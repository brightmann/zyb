name: Rebuild on discussion change

# Content is baked in at build time (static export), so any discussion
# create/edit/delete triggers an empty commit, which makes Workers Builds
# rebuild and redeploy automatically. No deploy hook needed.
on:
  discussion:
    types:
      [created, edited, deleted, pinned, unpinned, locked, unlocked, category_changed]

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next14
      - name: Trigger rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: rebuild for discussion update"
          git push origin next14
